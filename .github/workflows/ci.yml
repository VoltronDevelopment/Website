# This is the only GitHub Actions workflow that runs today: Website is the only
# git remote. Sibling ERP/SCADA/Twin trees are not in this repository and are
# gated by the workspace-root workflow when those products share a repo.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  website-static:
    name: Website lint, tests, secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Secret scan
        run: npm run secret-scan

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.voltronlattice.com

      - name: Performance asset and bundle budgets
        run: node scripts/check-performance-budgets.mjs

      - name: Install performance browser
        run: npx playwright install --with-deps chromium

      - name: Browser performance regression checks
        run: node scripts/performance-audit-20261023.cjs
        env:
          AUDIT_CI: "1"
          AUDIT_BROWSER: chromium
          AUDIT_DIST_DIR: .next
          AUDIT_OUTPUT_DIR: .audit-logs/performance-ci

      - name: Save performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-evidence
          path: .audit-logs/performance-ci

      - name: Page consistency and hero regression checks
        run: node scripts/site-quality-audit.cjs
        env:
          SITE_AUDIT_CI: "1"
          SITE_AUDIT_PHASE: verified
          SITE_AUDIT_BROWSER: chromium
          SITE_AUDIT_DIST: .next

      - name: Save page consistency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-quality-evidence
          path: .audit-logs/site-quality-20261024/verified

  website-dependency-audit:
    name: Website dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high severity)
        run: npm audit --audit-level=high
