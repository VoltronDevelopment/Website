version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e VOLTRON_AWS_REGION -e INQUIRIES_TABLE_NAME -e INQUIRY_TO_EMAIL -e SES_FROM_EMAIL >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
