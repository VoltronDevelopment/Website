version: 1
frontend:
  phases:
    preBuild:
      commands:
        - test -f package-lock.json || (echo "ERROR package-lock.json missing" && exit 1)
        - npm ci
    build:
      commands:
        - test -n "$INQUIRIES_TABLE_NAME" && test -n "$VOLTRON_AWS_REGION"
        - if [ "$VOLTRON_INQUIRY_EMAIL" = "1" ]; then test -n "$SES_FROM_EMAIL" && test -n "$INQUIRY_TO_EMAIL"; fi
        - env | grep -E '^(VOLTRON_AWS_REGION|INQUIRIES_TABLE_NAME|VOLTRON_INQUIRY_EMAIL|INQUIRY_TO_EMAIL|SES_FROM_EMAIL|NEXT_PUBLIC_SITE_URL|FOUNDER_CREDENTIALS|FOUNDER_SESSION_SECRET)=' >> .env.production
        - echo VOLTRON_SHARED_LIMITS=1 >> .env.production
        - env | grep -E '^(VECTRA_DATABASE_URL|VECTRA_MODEL|OPENAI_API_KEY)=' >> .env.production || true
        - VECTRA_STAGE_KNOWLEDGE=1 npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
