version: 1
frontend:
  phases:
    preBuild:
      commands:
        - test -f package-lock.json || (echo "ERROR package-lock.json missing" && exit 1)
        - npm ci
    build:
      commands:
        - env | grep -e VOLTRON_AWS_REGION -e INQUIRIES_TABLE_NAME -e INQUIRY_TO_EMAIL -e SES_FROM_EMAIL -e NEXT_PUBLIC_SITE_URL -e PROJECTS_TABLE_NAME -e REVIEWS_TABLE_NAME >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
