<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 520" width="640" height="520" class="static" role="img" aria-labelledby="hero-title hero-desc"><title id="hero-title">Voltron lattice</title><desc id="hero-desc">An airy connected cube lattice surrounds the leaf and circuit emblem.</desc>
<defs>
 <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".65"/><stop offset="1" stop-color="#D3E8F7" stop-opacity=".15"/></linearGradient>
 <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E8F0F7" stop-opacity=".30"/><stop offset="1" stop-color="#B9D9EE" stop-opacity=".12"/></linearGradient>
 <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#BCD7E9" stop-opacity=".20"/><stop offset="1" stop-color="#8DC4E7" stop-opacity=".12"/></linearGradient>
 <radialGradient id="ground"><stop stop-color="#397CAE" stop-opacity=".12"/><stop offset="1" stop-color="#397CAE" stop-opacity="0"/></radialGradient>
 <radialGradient id="clear-center"><stop offset="0" stop-color="black"/><stop offset=".65" stop-color="black"/><stop offset="1" stop-color="white"/></radialGradient><mask id="logo-space"><rect width="640" height="520" fill="white"/><ellipse cx="320" cy="243" rx="92" ry="92" fill="url(#clear-center)"/></mask>
 <filter id="node-glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
.edge{fill:none;stroke:#397CAE;stroke-width:1.25;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.53}
.node{fill:#246BD4;opacity:.82}.rear{opacity:.30}.face{stroke:none}.highlight{stroke:#FFFFFF;stroke-width:1;opacity:.6;fill:none}
.animated .edge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .36s cubic-bezier(.45,0,.25,1) forwards;animation-delay:var(--delay)}
.animated .node{opacity:0;animation:arrive .20s ease-out forwards;animation-delay:var(--delay)}
.animated .face{opacity:0;animation:appear .55s cubic-bezier(.22,1,.36,1) forwards;animation-delay:var(--delay)}
.animated .logo{opacity:0;animation:appear .55s cubic-bezier(.22,1,.36,1) 1.25s forwards}
.animated .glow{opacity:0;animation:pulse .45s ease-in-out var(--delay) both}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes arrive{to{opacity:.82}}@keyframes appear{to{opacity:1}}@keyframes pulse{0%,100%{opacity:0}45%{opacity:.28}}
@media(prefers-reduced-motion:reduce){.animated .edge{animation:none;stroke-dashoffset:0}.animated .face,.animated .node,.animated .logo{animation:none;opacity:1}.animated .glow{animation:none;opacity:0}}
</style>
